server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/health/ {
        proxy_pass http://pilgrimageBackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Groups "";
        proxy_set_header X-Portfolio-Edge-Secret "";
    }

    location ~ "^/api/shared/[^/]+/?$" {
        proxy_pass http://pilgrimageBackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Groups "";
        proxy_set_header X-Portfolio-Edge-Secret "";
    }

    location /api/ {
        proxy_pass http://pilgrimageBackend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header X-Portfolio-Edge-Secret $http_x_portfolio_edge_secret;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
