services:
  pilgrimageDB:
    build: ./db
    image: pilgrimage-db
    container_name: pilgrimageDB
    environment:
      POSTGRES_DB: pilgrimage
      POSTGRES_USER: pilgrimage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pilgrimageDBData:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - pilgrimage
    restart: always

  pilgrimageRedis:
    image: redis:7-alpine
    container_name: pilgrimageRedis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - pilgrimage
    restart: always

  pilgrimageBackend:
    build: ./backend
    image: pilgrimage-backend
    container_name: pilgrimageBackend
    depends_on:
      - pilgrimageDB
      - pilgrimageRedis
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: pilgrimageDB
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://pilgrimageRedis:6379/0
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "127.0.0.1:9174:8000"
    networks:
      - pilgrimage
    restart: always

  pilgrimageFrontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY}
        VITE_API_BASE_URL: /api
    image: pilgrimage-frontend
    container_name: pilgrimageFrontend
    depends_on:
      - pilgrimageBackend
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - /home/cks/pilgrimage/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pilgrimage
    restart: always

volumes:
  pilgrimageDBData:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cks/pilgrimage/dbmnt

networks:
  pilgrimage:
    name: pilgrimage
    driver: bridge
