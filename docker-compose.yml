services:
  pilgrimageRedis:
    image: redis:7-alpine
    container_name: pilgrimageRedis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - pilgrimage
    restart: always

  pilgrimageBackend:
    image: ${PILGRIMAGE_BACKEND_IMAGE:-ghcr.io/facio313/pilgrimage-backend:latest}
    container_name: pilgrimageBackend
    depends_on:
      - pilgrimageRedis
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: pilgrimage
      POSTGRES_USER: pilgrimage
      POSTGRES_HOST: cksDB
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://pilgrimageRedis:6379/0
      PILGRIMAGE_SSO_ENABLED: ${PILGRIMAGE_SSO_ENABLED:-false}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "127.0.0.1:9174:8000"
    networks:
      - pilgrimage
      - cksDB
    restart: always

  pilgrimageFrontend:
    image: ${PILGRIMAGE_FRONTEND_IMAGE:-ghcr.io/facio313/pilgrimage-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_SSO_ENABLED: ${PILGRIMAGE_SSO_ENABLED:-false}
    container_name: pilgrimageFrontend
    depends_on:
      - pilgrimageBackend
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - pilgrimage
    restart: always

networks:
  pilgrimage:
    name: pilgrimage
    driver: bridge
  cksDB:
    external: true
    name: cksDB
