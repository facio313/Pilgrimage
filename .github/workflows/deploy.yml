name: Build and deploy to RPi5

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: pilgrimage-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/facio313/pilgrimage-backend
  FRONTEND_IMAGE: ghcr.io/facio313/pilgrimage-frontend
  PORTFOLIO_BRANCH: ${{ github.ref_name }}
  PORTFOLIO_AUTH_MODE: sso

jobs:
  validate:
    name: Validate on x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-secret-key-not-used-outside-github-actions
      POSTGRES_DB: pilgrimage
      POSTGRES_USER: pilgrimage
      POSTGRES_PASSWORD: pilgrimage-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      PILGRIMAGE_SSO_ENABLED: "true"
      VITE_SSO_ENABLED: "true"
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:83e9999dc3ad8390c210e76130c3a16365ef4f957bb55200d22b7937cfbcb321
        env:
          POSTGRES_DB: pilgrimage
          POSTGRES_USER: pilgrimage
          POSTGRES_PASSWORD: pilgrimage-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilgrimage -d pilgrimage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2.7-alpine@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate branch-bound authentication contract
        run: |
          scripts/test-portfolio-auth-mode.sh
          scripts/test-auth-integration.sh

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install GeoDjango and Python dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev
          python -m pip install --disable-pip-version-check uv==0.11.16
          uv sync --locked --all-extras

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Validate and apply migrations
        working-directory: backend
        env:
          PILGRIMAGE_SSO_EDGE_SECRET: ci-only-pilgrimage-edge-secret-2026
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check

      - name: Test backend
        working-directory: backend
        env:
          PILGRIMAGE_SSO_EDGE_SECRET: ci-only-pilgrimage-edge-secret-2026
        run: uv run pytest -q

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run build

      - name: Validate Compose configuration
        run: |
          install -m 600 /dev/null .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-24.04-arm
    # Image builds precede a host lock that may wait up to 20 minutes.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GHCR
        if: github.ref_name == 'main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./backend
          build-args: |
            PORTFOLIO_BRANCH=${{ env.PORTFOLIO_BRANCH }}
            PORTFOLIO_AUTH_MODE=${{ env.PORTFOLIO_AUTH_MODE }}
          platforms: linux/arm64
          push: ${{ github.ref_name == 'main' }}
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=pilgrimage-backend
          cache-to: type=gha,mode=max,scope=pilgrimage-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./frontend/Dockerfile
          build-args: |
            PORTFOLIO_BRANCH=${{ env.PORTFOLIO_BRANCH }}
            PORTFOLIO_AUTH_MODE=${{ env.PORTFOLIO_AUTH_MODE }}
            VITE_SSO_ENABLED=true
          platforms: linux/arm64
          push: ${{ github.ref_name == 'main' }}
          pull: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=pilgrimage-frontend
          cache-to: type=gha,mode=max,scope=pilgrimage-frontend

      - name: Deploy immutable images on RPi5
        if: github.ref_name == 'main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' \
            '[ssh.bonifacio.work]:22022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII91ovdQZMg9NpUyjjFSS0Ra0SEuYuAw4Uv3GTv6J92F' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT

          { printf '%s\n' "$GHCR_TOKEN"; printf '%s\n' "$DEPLOY_ACTOR"; } | ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p 22022 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            cks@ssh.bonifacio.work \
            "deploy pilgrimage $GITHUB_SHA"
